version: "3"

# Global environment file configuration
dotenv: [".env"]

vars:
  FRONTEND_DIR: frontend
  BACKEND_DIR: backend

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task -l

  # ---------------------------------------------------------------------------
  # Development Tasks
  # ---------------------------------------------------------------------------
  dev:
    desc: Start both Next.js frontend and Go backend concurrently
    deps:
      - dev:frontend
      - dev:backend

  dev:frontend:
    desc: Start Next.js development server
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - pnpm dev

  dev:backend:
    desc: Start Go Fiber server with Air hot-reload
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - air

  # ---------------------------------------------------------------------------
  # Build & Quality Assurance
  # ---------------------------------------------------------------------------
  build:
    desc: Build both frontend and backend for production
    cmds:
      - task: build:frontend
      - task: build:backend

  build:frontend:
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - pnpm build

  build:backend:
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - go build -o bin/server ./cmd/server

  # ---------------------------------------------------------------------------
  # Testing Tasks
  # ---------------------------------------------------------------------------
  test:
    desc: Run unit and integration tests across both frontend and backend
    cmds:
      - echo "Running Frontend Tests..."
      - cd {{.FRONTEND_DIR}} && pnpm test:run
      - echo "Running Backend Tests..."
      - cd {{.BACKEND_DIR}} && go test -v ./...

  test:frontend:
    desc: Run frontend unit and integration tests
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - pnpm test

  test:backend:
    desc: Run backend unit and integration tests
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - go test -v ./...

  test:coverage:
    desc: Run tests and generate coverage reports for both frontend and backend
    cmds:
      - echo "Running Frontend Tests with Coverage..."
      - cd {{.FRONTEND_DIR}} && pnpm test:run --coverage
      - echo "Running Backend Tests with Coverage..."
      - cd {{.BACKEND_DIR}} && go test -v -coverprofile=coverage -covermode=atomic ./... && go tool cover -html=coverage
      - echo "Coverage reports generated for both frontend and backend."
      - echo "Backend coverage report will open in your default browser. Frontend coverage report can be found in the 'coverage' directory of the frontend project. frontend/coverage/index.html"

  test:coverage:frontend:
    desc: Run frontend tests and generate coverage report
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - pnpm test:run --coverage

  test:coverage:backend:
    desc: Run backend tests and generate coverage report
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - go test -v -coverprofile=coverage -covermode=atomic ./... && go tool cover -html=coverage

  lint:
    desc: Run linter checks on both codebases
    cmds:
      - cd {{.FRONTEND_DIR}} && pnpm lint
      - cd {{.BACKEND_DIR}} && golangci-lint run
