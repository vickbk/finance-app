name: Vitest Tests & Linting
permissions:
    contents: read
    pull-requests: write
on:
    push:
        branches: [main, master]
        paths:
            - "frontend/**"
    pull_request:
        branches: [main, master]
        paths:
            - "frontend/**"
jobs:
    test:
        timeout-minutes: 60
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./frontend
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
            - name: Install dependencies
              run: npm install -g pnpm && pnpm install
            - name: Run Vitest tests
              run: pnpm test:run
            - name: Run linting
              run: pnpm lint
            - uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  name: test-results
                  path: test-results/
                  retention-days: 30
