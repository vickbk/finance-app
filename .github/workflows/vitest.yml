name: Vitest Tests & Linting

on:
  push:
    branches:
      - main
      - master
    paths:
      - "frontend/**"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "frontend/**"

permissions:
  contents: read
  pull-requests: write

env:
  TOTAL_PCT: 0

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/setup@v1
        with:
          version: 11
          cache: true
          runtime: node@24
          cache-dependency-path: "frontend/pnpm-lock.yaml"
          package-json-file: "frontend/package.json"
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm lint

      - name: Run Vitest with coverage
        run: pnpm test run --coverage

      - name: Generate Coverage Report Summary
        id: coverage
        run: pnpm coverage-summary

      - name: Post Coverage Comment on PR
        if: github.event_name == 'pull_request' && success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
        run: pnpm coverage-comment

      - name: Upload HTML Coverage Artifact
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          retention-days: 14

      - name: Verify documentation drifts
        id: docs-check
        run: pnpm readme-check
      - name: Post Documentation Comment on PR
        if: always() && github.event_name == 'pull_request'
        env:
          DOCS_RUN_OUTCOME: ${{ steps.docs-check.outcome }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
        run: pnpm readme-comment
