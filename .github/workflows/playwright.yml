name: Playwright Tests

on:
  push:
    branches:
      - main
      - master
    paths:
      - "frontend/**"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "frontend/**"

permissions:
  contents: read
  pull-requests: write

env:
  BACKEND_URL: "http://localhost:8080"
  AUTH_SECRET: "ci-test-auth-secret-32-chars-min"
  AUTH_GOOGLE_ID: "ci-google-id"
  AUTH_GOOGLE_SECRET: "ci-google-secret"
  AI_PROVIDER_KEY: "ci-ai-key"
  GOOGLE_GENERATIVE_AI_API_KEY: "ci-genai-key"

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/setup@v1
        with:
          version: 11
          cache: true
          runtime: node@24
          cache-dependency-path: "frontend/pnpm-lock.yaml"
          package-json-file: "frontend/package.json"
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache Playwright browser binaries to save 2-3 minutes per run
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers & OS Dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps

      - name: Install Playwright OS Dependencies (when cache hits)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps

      - name: Run Playwright tests
        run: pnpm exec playwright test

      - name: Add Playwright Summary to Job
        if: ${{ !cancelled() }}
        run: |
          echo "## 🎭 Playwright E2E Test Run Complete" >> $GITHUB_STEP_SUMMARY
          echo "Download the HTML report artifact below to inspect traces and video recordings for failed tests." >> $GITHUB_STEP_SUMMARY

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
